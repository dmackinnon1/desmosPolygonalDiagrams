name: Compile with BookML
on: 
  workflow_dispatch:
jobs:
  # Job 1: Build the HTML using bookml and prepare the artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Compile with bookml
        uses: docker://ghcr.io/vlmantova/bookml:latest
        with:
         args: -k all aux-zip 

      - name: Unzip and Prepare Artifact
        run: |
          # Unzip the file, which creates a 'public/main' directory
          unzip -o main.zip -d public
          # Move all files from 'public/main' up to 'public'
          mv public/main/* public/
          # Remove the now-empty 'main' directory
          rmdir public/main
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the contents of the 'public' directory
          path: ./public

  # Job 2: Deploy the artifact to GitHub Pages
  deploy:
    # This job runs only after the 'build' job has succeeded
    needs: build
    # Grant permissions for the workflow to deploy to Pages
    permissions:
      pages: write
      id-token: write
    # Specify the deployment environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
